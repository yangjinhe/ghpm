name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !endsWith(github.ref_name, '-gui') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            deb: true
          - goos: linux
            goarch: arm64
            deb: true
          - goos: darwin
            goarch: amd64
            deb: false
          - goos: darwin
            goarch: arm64
            deb: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          name="ghpm_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}/examples"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X ghpm/internal/version.Version=${version} -X ghpm/internal/version.Commit=${commit}" \
            -o "dist/${name}/ghpm" ./cmd/ghpm
          cp README.md "dist/${name}/"
          cp examples/config.yaml "dist/${name}/examples/"
          # Man pages are generated from the same tree and committed; running
          # the cross-compiled binary here would fail on the amd64 runner.
          mkdir -p "dist/${name}/docs"
          cp -r docs/man "dist/${name}/docs/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
      - name: Build deb package
        if: matrix.deb
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="ghpm_${version}_${GOOS}_${GOARCH}"
          pkg="pkg"
          rm -rf "$pkg"
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/share/man/man1" "$pkg/usr/share/doc/ghpm"
          cp "dist/${name}/ghpm" "$pkg/usr/bin/ghpm"
          for m in "dist/${name}"/docs/man/*.1; do
            gzip -9c "$m" > "$pkg/usr/share/man/man1/$(basename "$m").gz"
          done
          cp README.md CHANGELOG.md "$pkg/usr/share/doc/ghpm/"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: ghpm
          Version: ${version}
          Architecture: ${GOARCH}
          Maintainer: yangjinhe
          Section: utils
          Priority: optional
          Description: Manage binaries published on GitHub releases
           ghpm resolves release assets for the current platform, verifies them,
           installs them under ~/.local for the current user, and tracks updates.
          EOF
          dpkg-deb --build --root-owner-group "$pkg" "dist/ghpm_${version}_${GOARCH}.deb"
          ( cd dist && sha256sum "ghpm_${version}_${GOARCH}.deb" > "ghpm_${version}_${GOARCH}.deb.sha256" )
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghpm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !endsWith(github.ref_name, '-gui') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compose release notes from CHANGELOG.md
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          notes="release-notes.md"
          awk -v v="$version" '
            /^## / {
              if (capture) exit
              if ($2 == "v" v) capture = 1
              next
            }
            capture { print }
          ' CHANGELOG.md > "$notes"
          # Drop leading blank lines.
          sed -i '/./,$!d' "$notes"
          if [ ! -s "$notes" ]; then
            printf 'Release %s\n\nSee CHANGELOG.md for details.\n' "$GITHUB_REF_NAME" > "$notes"
          fi
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> "$notes"
          fi
          echo '--- release notes ---'
          cat "$notes"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          fail_on_unmatched_files: true

  gui-darwin:
    if: ${{ endsWith(github.ref_name, '-gui') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: gui/go.sum
      - name: Build macOS app and dmg
        run: |
          set -eu
          version="${GITHUB_REF_NAME%-gui}"
          version="${version#v}"
          python3 - "$version" <<'PY'
          import json, sys
          path = "mygo.json"
          with open(path) as f:
              config = json.load(f)
          config["version"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY
          go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build \
            -platform darwin/universal -skip-notarize -skip-installer
          mkdir -p ../dist/gui
          find build -type f -name '*.dmg' -exec cp {} ../dist/gui/ \;
          ls -lh ../dist/gui
      - uses: actions/upload-artifact@v4
        with:
          name: ghpm-gui-darwin
          path: dist/gui/*
          if-no-files-found: error

  gui-linux:
    if: ${{ endsWith(github.ref_name, '-gui') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: gui/go.sum
      - name: Build Linux archives and packages
        run: |
          set -eu
          version="${GITHUB_REF_NAME%-gui}"
          version="${version#v}"
          python3 - "$version" <<'PY'
          import json, sys
          path = "mygo.json"
          with open(path) as f:
              config = json.load(f)
          config["version"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY
          go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build \
            -platform linux/amd64,linux/arm64 -skip-notarize -skip-installer
          mkdir -p ../dist/gui
          find build -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} ../dist/gui/ \;
          ls -lh ../dist/gui
      - uses: actions/upload-artifact@v4
        with:
          name: ghpm-gui-linux
          path: dist/gui/*
          if-no-files-found: error

  gui-publish:
    needs: [gui-darwin, gui-linux]
    if: ${{ endsWith(github.ref_name, '-gui') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/gui
          merge-multiple: true
      - name: Compose GUI release notes
        run: |
          set -eu
          notes="release-notes.md"
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / {
              if (capture) exit
              if ($2 == tag) capture = 1
              next
            }
            capture { print }
          ' gui/CHANGELOG.md > "$notes"
          sed -i '/./,$!d' "$notes"
          if [ ! -s "$notes" ]; then
            printf 'ghpm-gui %s\n' "$GITHUB_REF_NAME" > "$notes"
          fi
          printf '\n## 安装\n\n```bash\nghpm add yangjinhe/ghpm --channel tag:%s --id ghpm-gui --install\n```\n\n也可以直接下载下方的 dmg / tar.gz。\n' "$GITHUB_REF_NAME" >> "$notes"
          ( cd dist/gui && sha256sum * > SHA256SUMS )
          echo '--- notes ---'
          cat "$notes"
      - name: Publish GUI release
        uses: softprops/action-gh-release@v2
        with:
          name: "ghpm-gui ${{ github.ref_name }}"
          body_path: release-notes.md
          files: dist/gui/*
          make_latest: "false"
          fail_on_unmatched_files: true
